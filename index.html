<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <header class="app-header">
        <div class="app-header__user" id="user-info"></div>
        <div class="app-header__actions" id="auth-actions"></div>
      </header>

      <div class="page page-main" id="page-main">
        <ul class="comments"></ul>
        <div class="add-form" id="add-form">
          <textarea
            type="textarea"
            class="add-form-text"
            placeholder="Введите ваш коментарий"
            rows="4"
            id="comment-input"
          ></textarea>
          <div class="add-form-row">
            <button class="add-form-button">Написать</button>
          </div>
        </div>
        <div class="auth-prompt" id="auth-prompt">
          <p class="auth-prompt__text">
            Чтобы добавить комментарий,
            <button class="auth-prompt__link" id="go-to-login">авторизуйтесь</button>
          </p>
        </div>
      </div>

      <div class="page page-login hidden" id="page-login">
        <div class="login-form">
          <h1 class="login-form__title">Вход</h1>
          <input
            type="text"
            class="login-form__input"
            placeholder="Логин"
            id="login-input"
          />
          <input
            type="password"
            class="login-form__input"
            placeholder="Пароль"
            id="password-input"
          />
          <div class="login-form__row">
            <button class="login-form__button" id="login-button">Войти</button>
          </div>
          <button class="login-form__back" id="back-to-main">← К комментариям</button>
        </div>
      </div>
    </div>
  </body>

  <script src="script.js"></script>
</html>
